theme = "gruvbox-dark"
diff_view = "side-by-side"      # or "unified"
ignore_whitespace = true        # ignore all whitespace in local VCS diffs
appearance = "system"           # or "dark" / "light"
mouse = true
leader = " "                    # configurable prefix for leader shortcuts
comment_vim = true              # vim modal editing in the review comment box
relative_line_numbers = true    # show rendered-row distances in the diff gutter
review_watch_interval_ms = 1000 # set to 0 to disable persisted-review polling
single_file_view = true

[[comment_types]]
id = "note"
label = "question"
definition = "ask for clarification"
color = "yellow"

[[comment_types]]
id = "issue"
color = "red"
definition = "must fix before merge"

[[comment_types]]
id = "praise"
definition = "positive feedback"

[[comment_types]]
id = "nit"
label = "nitpick"
definition = "small optional tweaks"
color = "#d19a66"
