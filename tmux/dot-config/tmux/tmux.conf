# Ghostty draws the tabs; tmux's status bar is duplicate chrome
set -g status off

# Truecolor and styled underlines through to the pane
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:usstyle"

# Let OSC sequences tmux doesn't understand reach Ghostty (OSC 99, etc.)
set -g allow-passthrough on

# Neovim quality of life
set -g escape-time 0
set -g focus-events on

# Scrollback lives in Ghostty now, so don't double-buffer heavily
set -g history-limit 2000

